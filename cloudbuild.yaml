steps:
  # Step 1 - Build the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/plan-extraction-eval/web:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/plan-extraction-eval/web:latest'
      - '.'

  # Step 2 - Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/plan-extraction-eval/web'

  # Step 3 - Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'plan-extraction-eval'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/plan-extraction-eval/web:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=128Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/plan-extraction-eval/web:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/plan-extraction-eval/web:latest'
